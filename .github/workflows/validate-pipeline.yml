name: Infrastructure Telemetry Validation
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  verify-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Monitor Syntax
        run: |
          bash -n monitor.sh
          echo "[+] Architectural syntax validated successfully."
